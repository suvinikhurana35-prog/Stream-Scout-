*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--w);color:var(--k);font:500 17px/1.5 'Space Grotesk',system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3,.big{font-family:'Archivo Black',Impact,sans-serif;text-transform:uppercase;line-height:.95;margin:0}
section{padding:48px 20px;max-width:760px;margin:auto}
.dark{background:var(--k);color:var(--w);max-width:none}.dark>div{max-width:760px;margin:auto}
h1{font-size:clamp(46px,14vw,110px)}.tagline{font-size:clamp(18px,4.5vw,24px);font-weight:700;color:#ffdf00;margin:14px 0 8px;letter-spacing:.2px}h2{font-size:clamp(30px,8vw,52px);margin-bottom:18px}

.dark .btn{border-color:var(--w);box-shadow:6px 6px 0 var(--w)}
.btn:hover{transform:translate(-3px,-3px) rotate(-1.5deg);box-shadow:10px 10px 0 var(--k)}.dark .btn:hover{box-shadow:10px 10px 0 var(--w)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0}
#globe{width:100%;height:300px;touch-action:pan-y;cursor:grab}
.tag{display:inline-block;border:2px solid currentColor;border-radius:99px;padding:2px 14px;font-weight:700;margin:4px 4px 0 0;transition:.2s}.tag:hover{background:var(--w);color:var(--k);transform:scale(1.1) rotate(-3deg)}
.light .tag:hover{background:var(--k);color:var(--w)}
.bar{height:14px;background:var(--g);border:2px solid var(--k);border-radius:9px;overflow:hidden;margin:4px 0 14px}.bar i{display:block;height:100%;background:var(--k);width:0;transition:width 1.2s cubic-bezier(.2,.9,.2,1)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:10px 0;padding:14px 16px;border:3px solid var(--k);border-radius:14px;background:var(--w);color:var(--k);font:inherit;font-weight:700;cursor:pointer;box-shadow:5px 5px 0 var(--k);transition:.18s}
.opt:hover{background:var(--k);color:var(--w);transform:translate(-3px,-3px) scale(1.01);box-shadow:9px 9px 0 #888}
.opt b{font-family:'Archivo Black';font-size:22px;opacity:.5}.opt.ok{background:var(--k);color:var(--w)}.opt.no{opacity:.35;text-decoration:line-through}
#prog{position:fixed;top:0;left:0;height:8px;background:var(--k);width:0;z-index:9;transition:.4s;margin-top:env(safe-area-inset-top,0px)}
.hud{display:flex;justify-content:space-between;font-weight:700;margin-bottom:14px}
.qcase{font-style:italic;border-left:6px solid var(--k);padding-left:12px;margin-bottom:12px}
.q{animation:in .45s both}@keyframes in{from{opacity:0;transform:translateY(30px) rotate(1deg)}}
.rv{opacity:0;transform:translateY(40px);transition:1s cubic-bezier(.2,.9,.2,1)}.rv.on{opacity:1;transform:none}
.card{border:4px solid var(--k);border-radius:22px;padding:22px;margin:16px 0;background:var(--w);box-shadow:8px 8px 0 var(--k);transition:.25s}.card:hover{transform:rotate(-1deg) translateY(-4px)}
.dark .card{border-color:var(--w);box-shadow:8px 8px 0 var(--w);background:var(--k)}
.marq{overflow:hidden;white-space:nowrap;background:var(--k);color:var(--w);padding:10px 0}.marq span{display:inline-block;animation:m 18s linear infinite;font-family:'Archivo Black';text-transform:uppercase}@keyframes m{to{transform:translateX(-50%)}}
.hide{display:none}.row{display:flex;gap:12px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,120px);background:var(--k);color:var(--w);padding:12px 22px;border-radius:99px;font-weight:700;transition:.3s;z-index:9}.toast.on{transform:translate(-50%,0)}
